name = "zenradius-license-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

routes = [
  { pattern = "api.license.zenradius.net", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://license.zenradius.net"

[[d1_databases]]
binding = "DB"
database_name = "zenradius-license"
database_id = "2bd773f2-bf66-449e-bf0c-0882891e087c"

# Opsional: rate limit heartbeat. Buat KV lalu isi id-nya, atau hapus blok ini.
# [[kv_namespaces]]
# binding = "RATE_KV"
# id = "REPLACE_WITH_KV_ID"

[observability]
enabled = true
