name: Auto bump version

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  auto-bump:
    runs-on: ubuntu-latest
    name: Auto-bump version.txt on main
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Auto-bump version.txt if not included in commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Checking last commit for version.txt changes..."
          # If the last commit already modified version.txt, skip to avoid loops
          if git show --name-only --pretty="" HEAD | grep -xq "version.txt"; then
            echo "version.txt present in last commit; skipping auto-bump."
            exit 0
          fi
          # Ensure version.txt exists
          if [ ! -f version.txt ]; then
            echo "ZenRadius V.0.0.0" > version.txt
          fi
          ver_line=$(cat version.txt | tr -d '\r\n')
          ver=$(echo "$ver_line" | grep -oE 'V\.[0-9]+(\.[0-9]+)*' | sed 's/^V\.//' || echo "0.0.0")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$ver"
          PATCH=${PATCH:-0}
          PATCH=$((PATCH+1))
          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bumping to V.${NEW_VER}"
          echo "ZenRadius V.${NEW_VER}" > version.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: auto-bump version to V.${NEW_VER} [skip ci]" || { echo "No changes to commit."; exit 0; }
          git push origin HEAD:main
