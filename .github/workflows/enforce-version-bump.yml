name: Enforce version bump

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: ['**']

jobs:
  enforce-version-bump:
    name: Check version.txt presence on changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files and enforce version bump
        run: |
          set -euo pipefail
          EVENT_NAME='${{ github.event_name }}'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
            HEAD='${{ github.event.pull_request.head.sha }}'
          else
            BASE='${{ github.event.before }}'
            HEAD='${{ github.sha }}'
          fi
          echo "Comparing $BASE..$HEAD"
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
            echo "Using initial commit as base: $BASE"
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD" || true)
          echo "Changed files:" 
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "No changed files detected."
            exit 0
          fi
          non_version=$(echo "$changed" | grep -v -x 'version.txt' || true)
          has_version=$(echo "$changed" | grep -x 'version.txt' || true)
          if [ -n "$non_version" ] && [ -z "$has_version" ]; then
            echo "::error::Detected changes other than version.txt but version.txt was not updated."
            echo "Changed files:" 
            echo "$changed"
            exit 1
          fi
          echo "Version bump check passed."
